<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <filter id="luchitoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#05070D" stroke="#F59E0B" stroke-width="3.5"/>
  <!-- Tactical Eye Contour -->
  <path d="M18 50 Q50 18 82 50 Q50 82 18 50 Z" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Inner Iris / Compass ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FFE259" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Glowing Pupil -->
  <circle cx="50" cy="50" r="11" fill="url(#pupilGlow)" filter="url(#luchitoGlow)"/>
  <circle cx="47" cy="47" r="3" fill="#FFFFFF" opacity="0.9"/>
  <!-- Crosshair Tactical Ticks for Clock Positions (12, 3, 6, 9) -->
  <line x1="50" y1="12" x2="50" y2="18" stroke="#FFE259" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="82" y1="50" x2="88" y2="50" stroke="#FFE259" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="82" x2="50" y2="88" stroke="#FFE259" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="18" y2="50" stroke="#FFE259" stroke-width="2.5" stroke-linecap="round"/>
</svg>
