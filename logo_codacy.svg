<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="codacyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="codacyDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Codacy Hexagon Shield -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" fill="#0B132B" stroke="url(#codacyGlow)" stroke-width="3" filter="url(#codacyDrop)"/>
  <!-- Stylized C / checkmark -->
  <path d="M 30 16 C 22 14, 15 20, 15 24 C 15 28, 22 34, 30 32" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="31" cy="16" r="2" fill="#34D399"/>
  <circle cx="31" cy="32" r="2" fill="#34D399"/>
</svg>
