<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="sonarGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00F0FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Sonar wave 1 (outer) -->
  <path d="M 8 38 A 28 28 0 0 1 36 10" stroke="url(#sonarGlow)" stroke-width="4.5" stroke-linecap="round" filter="url(#glowDrop)"/>
  <!-- Sonar wave 2 (mid) -->
  <path d="M 8 38 A 19 19 0 0 1 27 19" stroke="url(#sonarGlow)" stroke-width="3.8" stroke-linecap="round"/>
  <!-- Sonar wave 3 (inner) -->
  <path d="M 8 38 A 10 10 0 0 1 18 28" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Source emitter node -->
  <circle cx="8" cy="38" r="3.2" fill="#00F0FF"/>
  <circle cx="8" cy="38" r="1.5" fill="#FFFFFF"/>
</svg>
