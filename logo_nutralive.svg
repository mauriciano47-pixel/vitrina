<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="nlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Contenedor redondeado tipo app icon -->
  <rect width="512" height="512" rx="128" fill="url(#nlGrad)"/>
  
  <!-- Círculo interior sutil de pulso celular -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12"/>
  
  <!-- Escudo celular / Hoja Botánica Nutricional -->
  <path d="M256,100 C340,100 390,160 390,250 C390,340 330,400 256,412 C182,400 122,340 122,250 C122,160 172,100 256,100 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Lóbulo hepático protector estilizado con nervio de vitalidad -->
  <path d="M256,140 C310,140 345,185 345,250 C345,315 300,360 256,375 C212,360 167,315 167,250 C167,185 202,140 256,140 Z" fill="#047857"/>
  
  <!-- Tallo central de precisión metabólica -->
  <path d="M256,180 L256,335" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <path d="M256,220 C280,205 300,215 305,230" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M256,260 C232,245 212,255 207,270" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M256,290 C276,275 296,285 301,300" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <!-- Punto de energía / Oro Imperial (Salud Celular) -->
  <circle cx="256" cy="180" r="18" fill="url(#nlGold)"/>
</svg>
