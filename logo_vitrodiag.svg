<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="50%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00F2FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowText">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <circle cx="256" cy="220" r="180" fill="#FF6F00" opacity="0.12" filter="blur(30px)"/>
  <circle cx="256" cy="220" r="100" fill="#00F2FE" opacity="0.08" filter="blur(20px)"/>

  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="#FF6F00" stroke-width="3" stroke-opacity="0.3"/>
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.2"/>

  <g transform="translate(0, -18)">
    <line x1="256" y1="65" x2="256" y2="365" stroke="#10B981" stroke-width="2" stroke-dasharray="6,5" opacity="0.4"/>

    <!-- Crown -->
    <rect x="222" y="70" width="68" height="24" rx="6" fill="url(#amberGrad)" filter="url(#glowAmber)"/>
    <rect x="228" y="74" width="56" height="16" rx="4" fill="#0F172A" opacity="0.4"/>
    
    <!-- Neck -->
    <rect x="230" y="94" width="52" height="65" rx="8" fill="none" stroke="url(#amberGrad)" stroke-width="11" filter="url(#glowAmber)"/>
    
    <!-- Shoulder -->
    <path d="M 190 205 C 190 170, 230 159, 230 159 L 282 159 C 282 159, 322 170, 322 205 Z" fill="url(#amberGrad)" opacity="0.15"/>
    <path d="M 190 205 L 230 159 L 282 159 L 322 205" fill="none" stroke="url(#amberGrad)" stroke-width="11" stroke-linejoin="round" filter="url(#glowAmber)"/>
    
    <!-- Body -->
    <rect x="190" y="205" width="132" height="145" rx="16" fill="url(#amberGrad)" opacity="0.1"/>
    <rect x="190" y="205" width="132" height="145" rx="16" fill="none" stroke="url(#amberGrad)" stroke-width="11" filter="url(#glowAmber)"/>
    
    <!-- Base -->
    <rect x="190" y="340" width="132" height="18" rx="8" fill="url(#amberGrad)" filter="url(#glowAmber)"/>

    <!-- Laser Scans -->
    <line x1="120" y1="240" x2="392" y2="240" stroke="url(#cyanGrad)" stroke-width="5" filter="url(#glowCyan)"/>
    <line x1="140" y1="285" x2="372" y2="285" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.75" filter="url(#glowCyan)"/>
    
    <!-- Reticle Corners -->
    <path d="M 170 220 L 170 205 L 185 205" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <path d="M 342 220 L 342 205 L 327 205" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <path d="M 170 330 L 170 345 L 185 345" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>
    <path d="M 342 330 L 342 345 L 327 345" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round"/>

    <!-- Laser Nodes -->
    <circle cx="256" cy="240" r="10" fill="#00F2FE" filter="url(#glowCyan)"/>
    <circle cx="256" cy="240" r="4" fill="#FFFFFF"/>
    <circle cx="256" cy="120" r="6" fill="#10B981" filter="url(#glowCyan)"/>
    <circle cx="256" cy="285" r="6" fill="#FF8C00" filter="url(#glowAmber)"/>
  </g>

  <!-- Banner & High-Legibility VITRODIAG Text -->
  <g filter="url(#shadowText)">
    <rect x="66" y="405" width="380" height="66" rx="33" fill="#090D16" fill-opacity="0.9" stroke="url(#amberGrad)" stroke-width="2.5"/>
    <text x="256" y="451" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="6px" fill="url(#textGrad)">VITRODIAG</text>
  </g>
</svg>