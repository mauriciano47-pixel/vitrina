<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo FinTech OLED -->
    <linearGradient id="cryptoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Gradiente Verde Bull / Esmeralda -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Gradiente Dorado / Ambar -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Filtro Resplandor -->
    <filter id="chartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Contenedor Base App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#cryptoBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#10B981" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Grilla de Trading Tecnológico -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="8 8">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="160" y1="100" x2="160" y2="400"/>
    <line x1="256" y1="100" x2="256" y2="400"/>
    <line x1="352" y1="100" x2="352" y2="400"/>
  </g>

  <!-- Velas Japonesas (Candlesticks) -->
  <g filter="url(#chartGlow)">
    <!-- Vela 1 (Bajista Roja/Rosa) -->
    <line x1="150" y1="200" x2="150" y2="340" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
    <rect x="136" y="230" width="28" height="70" rx="6" fill="#EF4444"/>

    <!-- Vela 2 (Doji / Reversión) -->
    <line x1="220" y1="250" x2="220" y2="370" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <rect x="208" y="300" width="24" height="18" rx="4" fill="#F59E0B"/>

    <!-- Vela 3 (Alcista Esmeralda Fuerte) -->
    <line x1="290" y1="140" x2="290" y2="320" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <rect x="274" y="170" width="32" height="110" rx="6" fill="url(#emeraldGrad)"/>

    <!-- Vela 4 (Breakout Bull) -->
    <line x1="362" y1="100" x2="362" y2="250" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
    <rect x="346" y="120" width="32" height="90" rx="6" fill="url(#emeraldGrad)"/>

    <!-- Línea de Tendencia / Algoritmo Predictivo WebSocket -->
    <path d="M 120 310 Q 210 330, 280 200 T 400 90" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="8" 
          stroke-linecap="round"/>
    
    <!-- Puntos de Conexión en Tiempo Real -->
    <circle cx="150" cy="265" r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="220" cy="309" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="290" cy="215" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="395" cy="95" r="11" fill="#FCD34D" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Insignia de Streaming 60 FPS -->
  <g transform="translate(196, 415)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="5" fill="#10B981"/>
    <text x="32" y="20" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#34D399">BINANCE WS</text>
  </g>
</svg>
