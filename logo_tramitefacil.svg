<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="tfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Contenedor redondeado tipo App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#tfBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#60A5FA" stroke-width="3" stroke-opacity="0.3"/>
  
  <!-- Ícono del documento de TrámiteFácil -->
  <g filter="url(#tfGlow)">
    <!-- Cuerpo del documento -->
    <rect x="116" y="86" width="280" height="340" rx="36" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Líneas de texto del documento burocrático simplificado -->
    <line x1="176" y1="170" x2="336" y2="170" stroke="#93C5FD" stroke-width="24" stroke-linecap="round"/>
    <line x1="176" y1="256" x2="336" y2="256" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <line x1="176" y1="342" x2="276" y2="342" stroke="#93C5FD" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Marca de verificación / simplificación -->
    <circle cx="356" cy="356" r="44" fill="#10B981" stroke="#FFFFFF" stroke-width="12"/>
    <path d="M342 356l10 10 18-18" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
