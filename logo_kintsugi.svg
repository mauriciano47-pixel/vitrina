<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="kintsugiBowlGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E162D"/>
      <stop offset="80%" stop-color="#0A0612"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="kintsugiGoldVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="kintsugiVeinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Halo Círculo Zen Ensō -->
  <circle cx="50" cy="50" r="46" fill="#08050E" stroke="rgba(212, 175, 55, 0.45)" stroke-width="2.5"/>
  <!-- Tazón Cerámico Chawan -->
  <path d="M22 38 Q50 34 78 38 C76 68 64 81 50 81 C36 81 24 68 22 38 Z" fill="url(#kintsugiBowlGrad)" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="50" cy="38" rx="28" ry="6.5" fill="#140E20" stroke="rgba(212, 175, 55, 0.55)" stroke-width="1.5"/>
  <!-- Fracturas Kintsugi Reparadas con Oro Puro (Líneas Áureas) -->
  <path d="M50 38 Q48 45 42 52 T45 64 T41 75 T50 81" fill="none" stroke="url(#kintsugiGoldVein)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#kintsugiVeinGlow)"/>
  <path d="M42 52 Q34 55 24 49" fill="none" stroke="url(#kintsugiGoldVein)" stroke-width="2.2" stroke-linecap="round" filter="url(#kintsugiVeinGlow)"/>
  <path d="M45 64 Q55 62 67 67" fill="none" stroke="url(#kintsugiGoldVein)" stroke-width="2.2" stroke-linecap="round" filter="url(#kintsugiVeinGlow)"/>
  <path d="M50 38 Q57 41 65 39" fill="none" stroke="url(#kintsugiGoldVein)" stroke-width="2" stroke-linecap="round" filter="url(#kintsugiVeinGlow)"/>
  <!-- Polvo de Oro & Destellos Kintsugi -->
  <circle cx="43" cy="49" r="1.5" fill="#FFE57F"/>
  <circle cx="48" cy="60" r="1.5" fill="#FFE57F"/>
  <circle cx="58" cy="63" r="1.3" fill="#FFE57F"/>
  <circle cx="36" cy="54" r="1.2" fill="#FFD700"/>
</svg>
