<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo Cyber-Obsidian -->
    <linearGradient id="sentinelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#05080E"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Gradiente Escudo Cibernético -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Gradiente Núcleo de Soberanía -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0077FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#05080E" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro de Resplandor Neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Contenedor Base App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#sentinelBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Líneas de Malla Cibernética / Circuito de Seguridad -->
  <g stroke="#00E5FF" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="120" x2="140" y2="120"/>
    <line x1="140" y1="120" x2="170" y2="90"/>
    <circle cx="80" cy="120" r="4" fill="#00E5FF" fill-opacity="0.3"/>

    <line x1="432" y1="120" x2="372" y2="120"/>
    <line x1="372" y1="120" x2="342" y2="90"/>
    <circle cx="432" cy="120" r="4" fill="#00E5FF" fill-opacity="0.3"/>

    <line x1="100" y1="390" x2="160" y2="390"/>
    <line x1="160" y1="390" x2="190" y2="420"/>
    <circle cx="100" cy="390" r="4" fill="#00E5FF" fill-opacity="0.3"/>

    <line x1="412" y1="390" x2="352" y2="390"/>
    <line x1="352" y1="390" x2="322" y2="420"/>
    <circle cx="412" cy="390" r="4" fill="#00E5FF" fill-opacity="0.3"/>
  </g>

  <!-- Resplandor central -->
  <circle cx="256" cy="246" r="140" fill="url(#coreGlow)"/>

  <!-- Escudo Mayor de Sentinel -->
  <g filter="url(#neonGlow)">
    <!-- Escudo Exterior -->
    <path d="M256 86 L386 142 V254 C386 338 328 402 256 428 C184 402 126 338 126 254 V142 Z" 
          fill="#070D1A" 
          fill-opacity="0.85"
          stroke="url(#shieldGrad)" 
          stroke-width="14" 
          stroke-linejoin="round"/>

    <!-- Escudo Interior / Capa Secundaria -->
    <path d="M256 122 L354 164 V248 C354 312 310 364 256 386 C202 364 158 312 158 248 V164 Z" 
          fill="none" 
          stroke="#00E5FF" 
          stroke-width="4" 
          stroke-opacity="0.5" 
          stroke-dasharray="12 6"
          stroke-linejoin="round"/>

    <!-- Ojo / Núcleo Soberano Zero-Knowledge -->
    <ellipse cx="256" cy="246" rx="60" ry="36" fill="none" stroke="#00E5FF" stroke-width="8"/>
    <circle cx="256" cy="246" r="22" fill="#00E5FF"/>
    <circle cx="256" cy="246" r="9" fill="#05080E"/>

    <!-- Rayos de Detección Cuántica -->
    <line x1="256" y1="184" x2="256" y2="198" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="294" x2="256" y2="308" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="246" x2="186" y2="246" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
    <line x1="326" y1="246" x2="340" y2="246" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
